<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Shop | Urban Threads</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- NAVBAR -->
  <header id="navbar">
    <nav class="navbar">

      <a href="index.html" class="brand">
        URBAN <span>THREADS</span>
      </a>

      <div class="nav-links">

        <a href="index.html">
          Home
        </a>

        <a href="shop.html">
          Shop
        </a>

        <a href="cart.html">
          Cart
        </a>

        <a href="login.html">
          Login
        </a>

        <span
          id="userEmail"
          class="user-email"
        ></span>

        <button
          id="logoutBtn"
          class="nav-button"
          type="button"
        >
          Logout
        </button>

      </div>

    </nav>
  </header>


  <!-- SHOP -->
  <main>

    <section class="section">

      <div class="section-heading">

        <p class="eyebrow">
          URBAN THREADS
        </p>

        <h1>
          Shop the collection.
        </h1>

        <p>
          Find your next favourite fit.
        </p>

      </div>


      <!-- SEARCH + CATEGORY -->
      <div class="shop-controls">

        <input
          id="searchInput"
          type="search"
          placeholder="Search products..."
        >

        <select id="categorySelect">

          <option value="all">
            All categories
          </option>

          <option value="Hoodies">
            Hoodies
          </option>

          <option value="T-shirts">
            T-Shirts
          </option>

          <option value="Sneakers">
            Sneakers
          </option>

          <option value="Accessories">
            Accessories
          </option>

        </select>

      </div>


      <!-- PRODUCTS -->
      <div
        id="productGrid"
        class="product-grid"
      ></div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer>

    <div class="footer-inner">

      <p>
        Urban Threads
      </p>

      <small>
        © 2026 Urban Threads. All rights reserved.
      </small>

    </div>

  </footer>


  <!-- JAVASCRIPT -->
  <script
    type="module"
    src="js/app.js"
  ></script>

  <script
    type="module"
    src="js/shop.js"
  ></script>

  <script
  type="module"
  src="js/seed-products.js"
></script>

</body>

</html>
