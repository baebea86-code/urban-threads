<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Cart | Urban Threads</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>


<body>

  <header id="navbar"></header>


  <main>

    <section class="section">

      <div class="section-heading">

        <p class="eyebrow">
          URBAN THREADS
        </p>

        <h1>Your cart.</h1>

        <p>
          Review your items before checkout.
        </p>

      </div>


      <div class="cart-layout">


        <!-- CART ITEMS -->

        <div
          id="cartItems"
          class="cart-items"
        >
          <!-- Cart items are rendered by cart.js -->
        </div>


        <!-- ORDER SUMMARY -->

        <aside class="summary-card">

          <h2>Order Summary</h2>


          <div class="summary-row">

            <span>
              Subtotal
            </span>

            <strong id="cartSubtotal">
              R0.00
            </strong>

          </div>


          <div class="summary-row">

            <span>
              Shipping
            </span>

            <strong id="cartShipping">
              R0.00
            </strong>

          </div>


          <div class="summary-row total">

            <span>
              Total
            </span>

            <strong id="cartTotal">
              R0.00
            </strong>

          </div>


          <a
            href="checkout.html"
            id="checkoutBtn"
            class="btn full"
          >
            Proceed to Checkout
          </a>


          <p class="checkout-note">
            Secure checkout. Payment processing is currently a demo.
          </p>

        </aside>

      </div>

    </section>

  </main>


  <footer></footer>


  <script
    type="module"
    src="js/app.js"
  ></script>

  <script
    type="module"
    src="js/cart.js"
  ></script>

</body>

</html>
