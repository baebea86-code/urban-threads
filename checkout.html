<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Checkout | Urban Threads</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header id="navbar"></header>

  <main class="auth-page">

    <section class="auth-card">

      <p class="eyebrow">URBAN THREADS</p>

      <h1>Checkout.</h1>

      <p>Complete your order details below.</p>

      <form id="checkoutForm">

        <label>
          Full name
          <input
            id="fullName"
            type="text"
            required
            placeholder="Your full name"
          >
        </label>

        <label>
          Delivery address
          <input
            id="address"
            type="text"
            required
            placeholder="Street address"
          >
        </label>

        <label>
          City
          <input
            id="city"
            type="text"
            required
            placeholder="Johannesburg"
          >
        </label>

        <label>
          Phone number
          <input
            id="phone"
            type="tel"
            required
            placeholder="Your phone number"
          >
        </label>

        <div class="summary-row total">
          <span>Total</span>
          <strong id="checkoutTotal">R0.00</strong>
        </div>

        <button
          type="submit"
          class="btn full"
        >
          Place Order
        </button>

      </form>

      <p id="checkoutMessage" class="message"></p>

    </section>

  </main>

  <footer></footer>

  <script
    type="module"
    src="js/app.js"
  ></script>

  <script
    type="module"
    src="js/checkout.js"
  ></script>

</body>

</html>
