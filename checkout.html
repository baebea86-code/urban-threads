<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Checkout | Urban Threads</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body>

  <header id="navbar"></header>

  <main>

    <section class="section">

      <div class="section-heading">

        <p class="eyebrow">
          URBAN THREADS
        </p>

        <h1>
          Checkout.
        </h1>

        <p>
          Complete your order.
        </p>

      </div>


      <div class="checkout-layout">

        <!-- CUSTOMER DETAILS -->

        <form
          id="checkoutForm"
          class="auth-card"
        >

          <h2>
            Your details
          </h2>


          <label>
            Full name

            <input
              id="customerName"
              type="text"
              required
              placeholder="Your name"
            >
          </label>


          <label>
            Email

            <input
              id="customerEmail"
              type="email"
              required
              placeholder="you@example.com"
            >
          </label>


          <label>
            Phone number

            <input
              id="customerPhone"
              type="tel"
              required
              placeholder="082 123 4567"
            >
          </label>


          <label>
            Delivery address

            <input
              id="customerAddress"
              type="text"
              required
              placeholder="Street address"
            >
          </label>


          <label>
            City

            <input
              id="customerCity"
              type="text"
              required
              placeholder="Johannesburg"
            >
          </label>


          <button
            type="submit"
            class="btn full"
          >
            Place Order
          </button>


          <p
            id="checkoutMessage"
            class="message"
          ></p>

        </form>


        <!-- ORDER SUMMARY -->

        <aside class="summary-card">

          <h2>
            Order summary
          </h2>

          <div id="checkoutItems"></div>

          <div class="summary-row total">

            <strong>
              Total
            </strong>

            <strong id="checkoutTotal">
              R0.00
            </strong>

          </div>

        </aside>

      </div>

    </section>

  </main>


  <footer></footer>


  <script
    type="module"
    src="js/app.js"
  ></script>

  <script
    type="module"
    src="js/checkout.js"
  ></script>

</body>

</html>
