<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account | Urban Threads</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="navbar">
    <div class="logo">
      <a href="index.html">Urban Threads</a>
    </div>
    <nav>
      <ul>
        <li><a href="shop.html">Shop</a></li>
        <li><a href="./cart.html">Cart</a></li>
        <li><a href="./login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <main class="auth-page">
    <section class="auth-card">
      <p class="eyebrow">URBAN THREADS</p>
      <h1 id="authTitle">Welcome back.</h1>
      <p id="authSubtitle">Log in to continue shopping.</p>

      <form id="authForm">
        <label>Email
          <input id="email" type="email" required placeholder="you@example.com">
        </label>

        <label>Password
          <input id="password" type="password" required minlength="6" placeholder="••••••••">
        </label>

        <button class="btn full" type="submit" id="authSubmit">Log in</button>
      </form>

      <p id="authMessage" class="message"></p>
      <button class="text-button" id="toggleAuth">Don't have an account? Sign up</button>
    </section>
  </main>

  <footer>
    <p>&copy; 2023 Urban Threads. All rights reserved.</p>
  </footer>
  
  <script type="module" src="js/auth.js"></script>
</body>
</html>
