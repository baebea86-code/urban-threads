<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Admin Dashboard | Urban Threads</title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >

</head>


<body>

  <header id="navbar"></header>


  <main>

    <section class="section">

      <div class="section-heading">

        <p class="eyebrow">
          URBAN THREADS
        </p>

        <h1>
          Admin Dashboard.
        </h1>

        <p>
          Manage your Urban Threads store.
        </p>

      </div>


      <!-- =========================
           DASHBOARD STATS
      ========================== -->

      <div class="category-grid">

        <div class="summary-card">

          <span class="product-category">
            PRODUCTS
          </span>

          <h2 id="productCount">
            0
          </h2>

        </div>


        <div class="summary-card">

          <span class="product-category">
            ORDERS
          </span>

          <h2 id="orderCount">
            0
          </h2>

        </div>


        <div class="summary-card">

          <span class="product-category">
            REVENUE
          </span>

          <h2 id="revenue">
            R0.00
          </h2>

        </div>


        <div class="summary-card">

          <span class="product-category">
            STORE STATUS
          </span>

          <h2>
            Active
          </h2>

        </div>

      </div>


      <!-- =========================
           ADD PRODUCT
      ========================== -->

      <div
        class="section-heading"
        style="margin-top: 5rem;"
      >

        <p class="eyebrow">
          INVENTORY
        </p>

        <h2>
          Add a product.
        </h2>

      </div>


      <form
        id="productForm"
        class="auth-card"
      >

        <label>

          Product name

          <input
            id="productName"
            type="text"
            placeholder="Classic Black Hoodie"
            required
          >

        </label>


        <label>

          Price

          <input
            id="productPrice"
            type="number"
            min="0"
            step="0.01"
            placeholder="699"
            required
          >

        </label>


        <label>

          Category

          <select
            id="productCategory"
            required
          >

            <option value="">
              Select category
            </option>

            <option value="Hoodies">
              Hoodies
            </option>

            <option value="T-shirts">
              T-Shirts
            </option>

            <option value="Sneakers">
              Sneakers
            </option>

            <option value="Accessories">
              Accessories
            </option>

          </select>

        </label>


        <label>

          Description

          <input
            id="productDescription"
            type="text"
            placeholder="A comfortable everyday hoodie."
            required
          >

        </label>


        <label>

          Image URL

          <input
            id="productImage"
            type="url"
            placeholder="https://example.com/image.jpg"
            required
          >

        </label>


        <button
          type="submit"
          class="btn full"
        >
          Add Product
        </button>


        <p
          id="productMessage"
          class="message"
        ></p>

      </form>


      <!-- =========================
           PRODUCTS
      ========================== -->

      <div
        class="section-heading"
        style="margin-top: 5rem;"
      >

        <p class="eyebrow">
          CURRENT INVENTORY
        </p>

        <h2>
          Products.
        </h2>

      </div>


      <div
        id="adminProducts"
        class="product-grid"
      >

        <p class="message">
          Loading products...
        </p>

      </div>


      <!-- =========================
           ORDERS
      ========================== -->

      <div
        class="section-heading"
        style="margin-top: 5rem;"
      >

        <p class="eyebrow">
          RECENT ACTIVITY
        </p>

        <h2>
          Recent Orders.
        </h2>

      </div>


      <div
        id="adminOrders"
        class="cart-items"
      >

        <p class="message">
          Loading orders...
        </p>

      </div>

    </section>

  </main>


  <footer></footer>


  <script
    type="module"
    src="js/app.js"
  ></script>

  <script
    type="module"
    src="js/admin.js"
  ></script>

</body>

</html>
